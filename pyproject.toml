[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosim"
version = "0.6.0"
description = "Simulateur d'écosystème multi-espèces individu-centré (agent-based) en Python."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "EcoSim contributors" },
]
keywords = ["ecology", "agent-based", "simulation", "genetics", "epidemiology", "SEIR"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Life",
]
dependencies = [
    "numpy>=1.24,<2",
    "scipy>=1.11,<2",
    "Pillow>=10.0,<11",
    "aiohttp>=3.9,<4",
    "noise>=1.2,<2",
    "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
ecosim = "ecosim.main:main"

[tool.setuptools]
packages = [
    "ecosim",
    "ecosim.config",
    "ecosim.engine",
    "ecosim.engine.recording",
    "ecosim.engine.utils",
    "ecosim.entities",
    "ecosim.monitoring",
    "ecosim.research",
    "ecosim.research.analysis",
    "ecosim.research.batch",
    "ecosim.web",
    "ecosim.world",
]

[tool.setuptools.package-data]
"ecosim" = [
    "data/species/*.json",
    "data/diseases/*.json",
    "web/static/*",
    "web/static/css/*",
    "web/static/js/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
